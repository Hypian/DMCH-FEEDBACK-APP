# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Configure API origin
        env:
          API_ORIGIN: ${{ vars.DMC_API_ORIGIN }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::warning::DMC_API_ORIGIN is unset. The static pages will deploy, but API/auth features need a deployed Node API."
            printf 'window.DMC_API_ORIGIN = "";\n' > frontend/api-config.js
          elif [[ ! "$API_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::DMC_API_ORIGIN must be an HTTPS origin without a path."
            exit 1
          else
            printf 'window.DMC_API_ORIGIN = "%s";\n' "$API_ORIGIN" > frontend/api-config.js
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
