<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E54B2B">
  <title>Set new password – DMC Hospital</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body data-auth-page="reset-password">
  <main class="auth-card">
    <a class="auth-brand" href="index.html"><img src="logo-optimized.jpg" alt="Dream Medical Center Hospital" width="760" height="221"></a>
    <p class="eyebrow">Account recovery</p>
    <h1>Set a new password</h1>
    <p class="intro-copy">Choose a new password for your account.</p>
    <form data-auth-form novalidate>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="auth-message" data-auth-message role="alert" aria-live="polite" hidden></p>
      <button class="btn" type="submit">Update password</button>
    </form>
    <nav class="auth-links" aria-label="Account links">
      <a href="login.html">Back to sign in</a>
    </nav>
  </main>
  <script type="module" src="auth-pages.js"></script>
</body>

</html>
