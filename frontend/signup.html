<body data-auth-page="signup">
  <main class="auth-card">
    <a class="auth-brand" href="index.html"><img src="logo.svg" alt="Dream Medical Center Hospital" width="760" height="221"></a>
    <p class="eyebrow">DMC account</p>
    <h1>Create account</h1>
    <p class="intro-copy">New accounts are not admins by default. An authorized operator must separately approve dashboard access.</p>
    <form data-auth-form method="post" novalidate>
      <label for="full-name">Full name</label>
      <input id="full-name" name="full_name" type="text" autocomplete="name" minlength="2" required>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]+" aria-describedby="username-help" required>
      <small id="username-help">3–30 letters, numbers, periods, or underscores.</small>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="auth-message" data-auth-message role="alert" aria-live="polite" hidden></p>
      <button class="btn" type="submit">Create account</button>
    </form>
    <nav class="auth-links" aria-label="Account links">
      <a href="login.html">Already have an account? Sign in</a>
      <a href="index.html">Patient feedback survey</a>
    </nav>
  </main>
  <dialog class="account-approval-dialog" data-account-dialog aria-labelledby="account-dialog-title">
    <div class="approval-dialog-mark" aria-hidden="true"><i class="bx bx-time-five"></i></div>
    <p class="eyebrow">DMC account</p>
    <h2 data-dialog-title id="account-dialog-title">Account created</h2>
    <p class="intro-copy" data-dialog-body></p>
    <form method="dialog"><button class="btn" type="submit">Understood</button></form>
  </dialog>
  <script src="api-config.js"></script>
  <script type="module" src="auth-pages.js"></script>
  <script src="ui-enhance.js" defer></script>
</body>

</html>
