<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E54B2B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DMC Feedback">
  <meta name="description" content="DMC Hospital – Out-Patient Department patient feedback survey.">
  <title>DMC Hospital – Patient Feedback</title>
  <link rel="icon" type="image/jpeg" href="logo-optimized.jpg">
  <link rel="apple-touch-icon" href="logo-optimized.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="logo-optimized.jpg" fetchpriority="high">
</head>

<body>
  <div id="splash">
    <img src="logo-optimized.jpg" alt="DMC" width="760" height="221" fetchpriority="high">
    <h1 id="wl" aria-live="polite"></h1>
    <div id="splash-langs" class ="splash-langs">
      <p class="splash-langs-label">Choose your language &bull; Choisissez votre langue &bull; Hitamo ururimi</p>
      <div class="splash-lang-options">
        <button type="button" class="splash-lang-btn" onclick="selectSplashLang('rw')">Kinyarwanda</button>
        <button type="button" class="splash-lang-btn" onclick="selectSplashLang('en')">English</button>
        <button type="button" class="splash-lang-btn" onclick="selectSplashLang('fr')">Français</button>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script src="script.js"></script>
  <script type="module" src="auth.js"></script>
</body>

</html>
