<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E54B2B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DMC Admin">
  <meta name="description" content="Sign in to your DMC Hospital administrator account.">
  <title>Sign in – DMC Hospital</title>
  <link rel="icon" type="image/jpeg" href="logo-optimized.jpg">
  <link rel="apple-touch-icon" href="logo-optimized.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body data-auth-page="login">
  <main class="auth-card">
    <a class="auth-brand" href="index.html"><img src="logo-optimized.jpg" alt="Dream Medical Center Hospital" width="760" height="221"></a>
    <p class="eyebrow">Admin access</p>
    <h1>Sign in</h1>
    <p class="intro-copy">Sign in to your DMC account.</p>
    <form data-auth-form novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="auth-message" data-auth-message role="alert" aria-live="polite" hidden></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <nav class="auth-links" aria-label="Account links">
      <a href="forgot-password.html">Forgot password?</a>
      <a href="signup.html">Create an account</a>
      <a href="index.html">Patient feedback survey</a>
    </nav>
  </main>
  <script type="module" src="auth-pages.js"></script>
</body>

</html>
